[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-client"
version = "0.3.34"
description = "Remote-only Hermes client and local tool worker"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Hermes Client contributors"}]
dependencies = [
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
worker = ["mcp>=1.9"]
test = ["pytest>=8"]

[project.scripts]
hermes-client = "hermes_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_client"]

[tool.hatch.build.targets.wheel.force-include]
"src/hermes_client/tui_dist/entry.js" = "hermes_client/tui_dist/entry.js"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
