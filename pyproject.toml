[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-client"
version = "0.1.0"
description = "Remote-only Hermes client and MacBook local tool worker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jeremy / Hermes"}]
dependencies = [
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
worker = ["mcp>=1.9"]
test = ["pytest>=8"]

[project.scripts]
hermes-client = "hermes_client.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
